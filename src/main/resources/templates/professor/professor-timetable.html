<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Mon emploi du temps | ScheduleTimetable</title>

    <link rel="stylesheet" th:href="@{/css/pages/student-timetable.css}"/>

    <link rel="stylesheet"
          href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css"/>
</head>

<body>

<input type="checkbox" id="toggle-sidebar"/>

<header>
    <div class="head-box">

        <label for="toggle-sidebar">
            <div id="menu">
                <img th:src="@{/images/menu-burger.png}" alt="Menu"/>
            </div>
        </label>

        <h1>Emploi du temps</h1>

    </div>
</header>

<section th:replace="professor/professor-app :: sidebar"></section>

<main class="page-content">

    <div class="page-heading">
        <div>
            <h2>Mon planning</h2>
            <p>Consultez votre emploi du temps universitaire.</p>
        </div>
    </div>

    <section class="timetable-card">

        <div class="card-header">

            <div>
                <h3>Emploi du temps</h3>
                <span>Votre planning de cours</span>
            </div>

            <span class="status-badge">
                <span></span>
                Disponible
            </span>

        </div>

        <div class="timetable-container">

            <img
                    class="timetable-image zoom-image responsive-image"
                    style="border: 1px solid transparent;"
                    th:src="@{/professor/preview}"
                    alt="Mon emploi du temps"
            />

        </div>

        <div class="card-footer">
            <i class="fi fi-ss-info"></i>
            <span>Vous pouvez agrandir l'image pour consulter les détails.</span>
        </div>

    </section>

</main>

</body>
</html>
