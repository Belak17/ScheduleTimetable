<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Tableau de bord professeur</title>

    <link rel="stylesheet"
          th:href="@{/css/pages/dashboard.css}"/>

    <link href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css"
          rel="stylesheet"/>
</head>

<body>

<input id="toggle-sidebar" type="checkbox"/>


<!-- HEADER -->

<header>
    <div class="head-box">

        <label for="toggle-sidebar" class="menu-toggle">
            <div id="menu">
                <img th:src="@{/images/menu-burger.png}" alt="Ouvrir le menu"/>
            </div>
        </label>

        <h2 th:text="'Bienvenue cher Professeur ' + ${fullname}">
        </h2>

    </div>
</header>


<!-- SIDEBAR -->

<section class="icons" th:fragment="sidebar">

    <div class="text-menu">
        <h2>Menu</h2>
    </div>

    <nav class="icons-option">

        <div class="icon-container">
            <a th:href="@{/professor/dashboard}">
                <img th:src="@{/images/home.png}" alt=""/>
                <span class="tooltip">Dashboard</span>
            </a>
        </div>

        <div class="icon-container">
            <a th:href="@{/professor/profile}">
                <img th:src="@{/images/user (1).png}" alt=""/>
                <span class="tooltip">Profil</span>
            </a>
        </div>

        <div class="icon-container">
            <a th:href="@{/professor/timetable}">
                <img th:src="@{/images/calendar-clock (1).png}" alt=""/>
                <span class="tooltip">Emploi du temps</span>
            </a>
        </div>

        <div class="icon-container">
            <label class="close-btn" for="toggle-sidebar">
                <img th:src="@{/images/grid.png}" alt=""/>
                <span class="tooltip">Espace</span>
            </label>
        </div>

        <div class="icon-container">
            <label class="close-btn" for="toggle-sidebar">
                <img th:src="@{/images/cross-small.png}" alt=""/>
                <span class="tooltip">Fermer</span>
            </label>
        </div>

    </nav>

</section>


<!-- CONTENU PRINCIPAL -->

<main class="center-wrapper">

    <!-- MENU PROFESSEUR -->

    <section class="dashboard-section">

        <h2 class="separator">Menu professeur</h2>

        <div class="grid">

            <article class="option">
                <a th:href="@{/professor/timetable}">

                    <div class="option-icon">
                        <img th:src="@{/images/academic-years.png}"
                             alt="Emploi du temps"/>
                    </div>

                    <p>Emploi du temps</p>

                </a>
            </article>

        </div>

    </section>


    <!-- MENU ADMINISTRATIF -->

    <section class="dashboard-section">

        <h2 class="separator">Menu administratif</h2>

        <div class="grid">

            <article class="option">
                <a th:href="@{/professor/profile}">

                    <div class="option-icon">
                        <img th:src="@{/images/user-profile.png}"
                             alt="Profil"/>
                    </div>

                    <p>Profil</p>

                </a>
            </article>

            <article class="option">
                <a th:href="@{/logout}">

                    <div class="option-icon">
                        <img th:src="@{/images/power-off.png}"
                             alt="Déconnexion"/>
                    </div>

                    <p>Déconnexion</p>

                </a>
            </article>

        </div>

    </section>

</main>

</body>
</html>
