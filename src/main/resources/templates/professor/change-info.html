<section class="option-clicked" th:fragment="option-clicked">
  <div class="title-bloc">
    <img th:src="@{/images/information-button.png}">
    <span>Modifier les Informations du profil</span>
  </div>
  <form th:action="@{/professor/edit-my-profile/update/info}" method="post">
    <span class="title-container">Informations Generales</span>
    <div class="generals-info">
      <div class="info-input">
        <label for="login">Login</label>
        <input id="login" class="input" name="userId" type="text" th:value="${professor.userId}" required>
      </div>
      <div class="info-input">
        <label for="lastname">Nom</label>
        <input id="lastname" class="input" disabled th:value="${professor.nom}">
      </div>
      <div class="info-input">
        <label for="firstname">Prenom</label>
        <input id="firstname" class="input" disabled th:value="${professor.prenom}">
      </div>
      <div class="info-input">
        <label for="telephone">Téléphone</label>
        <input id="telephone" class="input" name="telephone" type="text" th:value="${professor.telephone}" required>
      </div>
      <div class="info-input">
        <label for="address">Adresse Postale</label>
        <input id="address" class="input" name="address" type="text" th:value="${professor.adresse}" required>
      </div>
      <div class="info-input">
        <label for="code">Code Postale</label>
        <input id="code" class="input" name="code"  type="text" th:value="${professor.codePostale}" required>
      </div>
    </div>
    <span class="title-container">Informations Academiques</span>
    <div class="academical-info">
      <div class="info-input">
        <label for="field">Departement</label>
        <span id="field" th:text="${professor.department}"></span>
      </div>
      <div class="info-input">
        <label for="level">Specialite</label>
        <span id="level" th:text="${professor.specialite}"></span>
      </div>
      <div class="info-input">
        <label for="group">Grade</label>
        <span id="group" th:text="${professor.grade}"></span>
      </div>
    </div>
    <section class="buttons">
      <button class="reset" type="reset">Reinitialiser</button>
      <button class="submit" type="submit">Envoyer</button>
    </section>
  </form>
</section>
