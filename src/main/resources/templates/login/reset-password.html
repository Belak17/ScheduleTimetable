<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

    <title>Réinitialisation du mot de passe</title>

    <link
            href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css"
            rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/login/reset-password.css}"/>

    <link
            href="https://cdn-uicons.flaticon.com/uicons-brands/css/uicons-brands.css"
            rel="stylesheet"
    />
</head>

<body>

<header>
    <img th:src="@{/images/logo_header-hb5kR36g.svg}"/>
</header>

<form
        class="login-box"
        method="post"
        th:action="@{/reset/password}"
        id="resetPasswordForm"
>

    <section class="left-block">

        <div class="presentation">
            <h2>Réinitialisation du mot de passe</h2>

            <h3>
                Choisissez un nouveau mot de passe pour sécuriser votre compte.
            </h3>
        </div>

        <input
                name="token"
                th:value="${token}"
                type="hidden"
        />

        <div class="inputs">

            <div class="input">
                <img th:src="@{/images/lock.png}"/>

                <input
                        autocomplete="new-password"
                        minlength="8"
                        name="password"
                        placeholder="Nouveau mot de passe"
                        required
                        type="password"
                        id="password"
                />
            </div>

            <div class="input">
                <img th:src="@{/images/lock.png}"/>

                <input
                        autocomplete="new-password"
                        minlength="8"
                        name="confirmPassword"
                        placeholder="Confirmer le nouveau mot de passe"
                        required
                        type="password"
                        id="confirmPassword"
                />
            </div>

        </div>

        <div class="password-hint">
            <i class="fi fi-ss-info"></i>
            Votre mot de passe doit contenir au moins 8 caractères.
        </div>

        <div
                class="alert"
                th:if="${error}"
                th:text="${error}"
        >
        </div>

        <div
                class="alert"
                th:if="${errorMessage}"
                th:text="${errorMessage}"
        >
        </div>

        <div
                class="pending"
                th:if="${message}"
                th:text="${message}"
        >
        </div>

        <div class="alert" id="passwordError" style="display: none;">
            Les deux mots de passe ne correspondent pas.
        </div>

        <div class="others">

            <button class="connect" type="submit">
                Réinitialiser mon mot de passe
            </button>

        </div>

    </section>

    <section class="right-block">
    </section>

</form>

<footer>

    <div>
        <img th:src="@{/images/flag-BfSDlfLV.png}"/>
        <h3>République Tunisienne</h3>
    </div>

    <p>
        © Faculté des Sciences de Gabès - Tous droits réservés
    </p>

    <a href="mailto:fsg.rnu.tn">fsg.rnu.tn</a>

</footer>

<style>

    /* Image décorative sur ordinateur */
    .right-block {
        width: 45%;
        background: url("/images/login_box_bg.png") center / cover no-repeat;
    }

    /* Arrière-plan flouté */
    body::before {
        content: "";
        position: fixed;
        top: -10px;
        left: -10px;
        right: -10px;
        bottom: -10px;

        background-image: url("/images/faculte-des-Sciences-de-Gabes.jpeg");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;

        filter: blur(3px);
        z-index: -1;
    }

    /* Indication sur le mot de passe */
    .password-hint {
        font-size: 0.85rem;
        color: #666;
        margin-top: 12px;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 7px;
    }

    .password-hint i {
        font-size: 1rem;
    }

    /* Tablettes et téléphones */
    @media screen and (max-width: 768px) {

        .login-box {
            flex-direction: column;
            min-height: auto;
        }

        .right-block {
            display: block;
            width: 100%;
            height: 65px;
            min-height: 0;

            flex: none;
            order: -1;

            margin: 5px auto 0;

            background-image: url("/images/logo_fsg.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: auto 55px;

            transform: none;
        }

        .left-block {
            padding: 25px 20px;
            margin-top: 0;
        }

        .others {
            transform: none;
        }

        .connect {
            width: 100%;
        }

        header img {
            width: 60%;
        }

        footer {
            display: none;
        }
    }

    /* Petits téléphones */
    @media screen and (max-width: 480px) {

        .right-block {
            height: 55px;
            margin: 3px auto 0;
            background-size: auto 48px;
        }

        .left-block {
            padding: 20px 15px;
        }

        .connect {
            width: 100%;
            font-size: 0.95rem;
        }

        .presentation h2 {
            font-size: 1.4rem;
        }

        header img {
            width: 60%;
        }
    }

</style>

<script>
    document.getElementById("resetPasswordForm").addEventListener("submit", function (event) {

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const error = document.getElementById("passwordError");

        if (password !== confirmPassword) {
            event.preventDefault();
            error.style.display = "block";
            return;
        }

        error.style.display = "none";
    });
</script>

</body>
</html>
