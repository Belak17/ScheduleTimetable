<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activation de Compte</title>
    <link rel="stylesheet"
          href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css">
    <link rel="stylesheet" th:href="@{/css/style-login/style-login.css}">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-brands/css/uicons-brands.css">

</head>
<body>
<header>
    <img th:src="@{/images/logo_header-hb5kR36g.svg}">
    <!--<h2>Bienvenue sur votre Plateforme  </h2> -->
    <a class="register" th:href="@{/firstlogin}">Nouveau ici ? </a>

</header>

<form class="login-box" method="post" th:action="@{/firstlogin/professor}" th:object="${professorRegister}">

    <input
            type="hidden"

            name="code"

            th:value="${code}"

    >
    <section class="left-block">
        <div class="presentation">
            <h2>Activation du Compte</h2>
            <h3> Enseignant/Administration</h3>
        </div>
        <div class="inputs">
            <div class="input">
                <img th:src="@{/images/email.png}">
                <input type="email" autocomplete="off" name="email" th:field="*{email}"
                       placeholder="Email" required >

            </div>
        </div>
        <div class="input">
            <img th:src="@{/images/lock.png}">
            <input type="password" autocomplete="off" name="password" th:field="*{password}"
                   placeholder="Mot de passe" required >

        </div>
        <div th:if="${failure}" class="alert">
            <span th:text="${failure}"></span>
        </div>


        <div th:if="${message}" class="pending">
            <span th:text="${message}"></span>
        </div>

        <div class="others">


            <button type="submit" class="connect">
                Activer Mon Compte Enseignant
            </button>


        </div>
    </section>

    <section class="right-block">
    </section>

</form>
<footer>
    <div>
        <img th:src="@{/images/flag-BfSDlfLV.png}">
        <h3>République Tunisienne </h3>
    </div>
    <p> &copy; Faculté des Sciences de Gabès -Tous droits réservés</p>
    <a href="mailto:fsg.rnu.tn">fsg.rnu.tn</a>
</footer>
<style>
    /* Image décorative sur ordinateur */
    .right-block {
        width: 45%;
        background: url("/images/login_box_bg.png") center / cover no-repeat;
    }

    /* Arrière-plan flouté */
    body::before {
        content: "";
        position: fixed;
        top: -10px;
        left: -10px;
        right: -10px;
        bottom: -10px;

        background-image: url("/images/faculte-des-Sciences-de-Gabes.jpeg");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;

        filter: blur(3px);
        z-index: -1;
    }

    /* Tablettes et téléphones */
    @media screen and (max-width: 768px) {

        .login-box {
            flex-direction: column;
            min-height: auto;
        }

        .right-block {
            display: block;
            width: 100%;
            height: 65px;
            min-height: 0;

            flex: none;
            order: -1;

            margin: 5px auto 0;

            background-image: url("/images/logo_fsg.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: auto 55px;

            transform: none;
        }

        .left-block {
            padding: 25px 20px;
            margin-top: 0;
        }

        .others {
            transform: none;
        }

        .connect {
            width: 100%;
        }

        header img {
            width: 60%;
        }

        footer {
            display: none;
        }
    }

    /* Petits téléphones */
    @media screen and (max-width: 480px) {

        .right-block {
            height: 55px;
            margin: 3px auto 0;
            background-size: auto 48px;
        }

        .left-block {
            padding: 20px 15px;
        }

        .connect {
            width: 100%;
            font-size: 0.95rem;
        }

        .register {
            font-size: 0.85rem;
            font-weight: 500;
            margin: 0;
        }

        header img {
            width: 60%;
        }
    }
</style>

</body>
</html>
