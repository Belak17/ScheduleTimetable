<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
    <link rel="stylesheet"
          href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css">
    <link rel="stylesheet" th:href="@{/css/style-login/style-login.css}">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-brands/css/uicons-brands.css">

</head>
<body>
<header>
    <img th:src="@{/images/logo_header-hb5kR36g.svg}">
    <!--<h2>Bienvenue sur votre Plateforme  </h2> -->
    <a class="register" th:href="@{/firstlogin}">Nouveau ici ? </a>

</header>
<form class="login-box" method="post" th:action="@{/perform_login}">

    <section class="left-block">
        <div class="presentation">
            <h2>Bienvenue sur Votre Plateforme</h2>
            <h3>Enseignant/Administration</h3>
            <input type="hidden" name="loginType" value="professor">
        </div>
        <div class="inputs">
            <div class="input">
                <img th:src="@{/images/user.png}">
                <input type="email"
                       autocomplete="email"
                       name="userId"
                       placeholder="Adresse e-mail"
                       required/>
            </div>
            <div class="input">
                <img th:src="@{/images/lock.png}">
                <input type="password" autocomplete="off" name="password"
                       placeholder="Mot de passe" required />

            </div>
        </div>
        <div th:if="${error == 'account_disabled'}" class="alert">
            Compte désactivé. Veuillez activer votre compte.
        </div>

        <div th:if="${error == 'bad_credentials'}" class="alert">
            Identifiants incorrects.
        </div>

        <div th:if="${error == 'user_not_found'}" class="alert">
            Utilisateur introuvable.
        </div>
        <div th:if="${message}" th:text="${message}" class="success">
        </div>
        <div class="others">

            <!--            <div class="forgot-link">-->
            <!--                <a th:href="@{/forgot}">Mot de passe oublié ?</a>-->
            <!--            </div>-->

            <button type="submit" class="connect">
                Se connecter
            </button>


        </div>
    </section>

    <section class="right-block">

    </section>

</form>
<footer>
    <div>
        <img th:src="@{/images/flag-BfSDlfLV.png}">
        <h3>République Tunisienne </h3>
    </div>
    <p> &copy; Faculté des Sciences de Gabès -Tous droits réservés</p>
    <a href="mailto:fsg.rnu.tn">fsg.rnu.tn</a>
</footer>
<style>
    /* Image décorative sur ordinateur */
    .right-block {
        width: 45%;
        background: url("/images/login_box_bg.png") center / cover no-repeat;
    }

    /* Arrière-plan flouté */
    body::before {
        content: "";
        position: fixed;
        top: -10px;
        left: -10px;
        right: -10px;
        bottom: -10px;

        background-image: url("/images/faculte-des-Sciences-de-Gabes.jpeg");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;

        filter: blur(3px);
        z-index: -1;
    }

    /* Tablettes et téléphones */
    @media screen and (max-width: 768px) {

        .login-box {
            flex-direction: column;
            min-height: auto;
        }

        .right-block {
            display: block;
            width: 100%;
            height: 65px;
            min-height: 0;

            flex: none;
            order: -1;

            margin: 5px auto 0;

            background-image: url("/images/logo_fsg.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: auto 55px;

            transform: none;
        }

        .left-block {
            padding: 25px 20px;
            margin-top: 0;
        }

        .others {
            transform: none;
        }

        .connect {
            width: 100%;
        }

        header img {
            width: 60%;
        }

        footer {
            display: none;
        }
    }

    /* Petits téléphones */
    @media screen and (max-width: 480px) {

        .right-block {
            height: 55px;
            margin: 3px auto 0;
            background-size: auto 48px;
        }

        .left-block {
            padding: 20px 15px;
        }

        .connect {
            width: 100%;
            font-size: 0.95rem;
        }

        .register {
            font-size: 0.85rem;
            font-weight: 500;
            margin: 0;
        }

        header img {
            width: 60%;
        }
    }
</style>

</body>
</html>
