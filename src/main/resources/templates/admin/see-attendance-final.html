<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste Cours TP</title>
    <link rel="stylesheet" th:href="@{/css/style-admin/admin-see-cours.css}">
    <link rel="stylesheet" th:href="@{/css/style-admin/style-admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/style-admin/style-see-all-professor-timetable.css}">
</head>
<body>
<input type="checkbox" id="toggle-sidebar" />
<header>
    <div class="head-box">
        <!-- Checkbox caché -->
        <label for="toggle-sidebar">
            <div  id="menu">
                <img th:src="@{/images/menu-burger.png}">
            </div>
        </label>
        <h2 class="text-title">Liste Cours TP</h2>
    </div>
</header>
<main class="center-container">
    <div class="table-content">
        <!-- Tableau -->
        <table bgcolor="lightgray" border="1" rules="all" class="styled-table">
            <thead>
            <tr>
                <!-- Toujours afficher le nom et prénom -->
                <th>Nom &amp; Prénom</th>

                <!-- Afficher les dates uniquement si des séances existent -->
                <th th:if="${not #lists.isEmpty(attendanceTable.dates)}"
                    th:each="date : ${attendanceTable.dates}"
                    th:text="${date}">
                </th>

                <!-- Toujours afficher Option -->
                <th>Option</th>
            </tr>
            </thead>

            <tbody>

            <!-- Afficher les étudiants même sans séance -->
            <tr th:each="row : ${attendanceTable.rows}">

                <!-- Nom et prénom toujours visibles -->
                <td>
                    <span th:text="${row.studentName}"></span>
                </td>

                <!-- Afficher les statuts uniquement si des séances existent -->
                <th:block th:if="${not #lists.isEmpty(attendanceTable.dates)}">
                    <td th:each="status : ${row.statuses}"
                        th:text="${status}">
                    </td>
                </th:block>

                <!-- Option toujours visible -->
                <td>
                    <a class="button clickable-row"
                       th:href="@{/absence/{id}(id=${row.id})}">
                        Historiques des Absences
                    </a>
                </td>

            </tr>

            <!-- Message si aucun étudiant n'est disponible -->
            <tr th:if="${#lists.isEmpty(attendanceTable.rows)}">
                <td th:colspan="${attendanceTable.dates.size() + 2}"
                    style="text-align: center;">
                    Aucun étudiant à afficher sur cette page.
                </td>
            </tr>

            </tbody>
        </table>
        <!-- Pagination -->
        <div class="pagination" style="margin-top: 20px;">

            <!-- Bouton Précédent -->
            <a th:if="${currentPage > 0}"
               th:href="@{/absence/courses/{id}(
           id=${id},
           page=${currentPage - 1},
           size=${size}
       )}"
               class="button">
                ← Précédent
            </a>

            <!-- Informations sur la page -->
            <span th:text="'Page ' + (${currentPage + 1}) + ' sur ' + ${totalPages}">
        Page 1 sur 2
    </span>

            <!-- Bouton Suivant -->
            <a th:if="${currentPage + 1 < totalPages}"
               th:href="@{/absence/courses/{id}(
           id=${id},
           page=${currentPage + 1},
           size=${size}
       )}"
               class="button">
                Suivant →
            </a>

        </div>
    </div>
</main>
<section th:replace="admin/admin-dashboard :: sidebar"></section>
<script>

</script>

</body>
</html>
