<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste Cours TP</title>

    <link rel="stylesheet" th:href="@{/css/style-admin/admin-see-cours.css}">
    <link rel="stylesheet" th:href="@{/css/style-admin/style-admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/style-admin/style-see-all-professor-timetable.css}">
</head>

<body>

<input type="checkbox" id="toggle-sidebar"/>

<header>
    <div class="head-box">
        <label for="toggle-sidebar">
            <div id="menu">
                <img th:src="@{/images/menu-burger.png}" alt="Menu">
            </div>
        </label>

        <h2 class="text-title">Liste Cours TP</h2>
    </div>
</header>

<main class="center-container">
    <div class="table-content">

        <!-- Informations générales -->
        <div class="table-info">
            <span>
                Nombre total d'étudiants :
                <strong th:text="${attendancePage.totalStudents}">0</strong>
            </span>
        </div>

        <!-- Tableau des présences -->
        <table class="styled-table" bgcolor="lightgray" border="1" rules="all">

            <thead>
            <tr>
                <th>Nom &amp; Prénom</th>

                <!-- Dates des séances -->
                <th th:each="date : ${attendancePage.attendanceTable.dates}"
                    th:text="${date}">
                </th>

                <th>Option</th>
            </tr>
            </thead>

            <tbody>

            <!-- Étudiants -->
            <tr th:each="row : ${attendancePage.attendanceTable.rows}">

                <td>
                    <span th:text="${row.studentName}"></span>
                </td>

                <!-- Statuts de présence -->
                <td th:each="status : ${row.statuses}"
                    th:text="${status}">
                </td>

                <td>
                    <a class="button clickable-row"
                       th:href="@{/absence/admin/{id}(id=${row.id})}">
                        Historique des absences
                    </a>
                </td>

            </tr>

            <!-- Aucun étudiant -->
            <tr th:if="${#lists.isEmpty(attendancePage.attendanceTable.rows)}">
                <td th:colspan="${attendancePage.attendanceTable.dates.size() + 2}"
                    style="text-align: center;">
                    Aucun étudiant à afficher.
                </td>
            </tr>

            </tbody>
        </table>

        <!-- Pagination -->
        <div class="pagination" style="margin-top: 20px;"
             th:if="${attendancePage.totalPages > 0}">

            <!-- Précédent -->
            <a th:if="${attendancePage.currentPage > 0}"
               th:href="@{/absence/courses/{id}(
                   id=${id},
                   page=${attendancePage.currentPage - 1},
                   size=${attendancePage.pageSize}
               )}"
               class="button">
                ← Précédent
            </a>

            <!-- Informations -->
            <span th:text="'Page ' + (${attendancePage.currentPage + 1})
                + ' sur ' + ${attendancePage.totalPages}">
                Page 1 sur 2
            </span>

            <!-- Suivant -->
            <a th:if="${attendancePage.currentPage + 1 < attendancePage.totalPages}"
               th:href="@{/absence/courses/{id}(
                   id=${id},
                   page=${attendancePage.currentPage + 1},
                   size=${attendancePage.pageSize}
               )}"
               class="button">
                Suivant →
            </a>

        </div>

    </div>
</main>

<section th:replace="admin/admin-dashboard :: sidebar"></section>

</body>
</html>
