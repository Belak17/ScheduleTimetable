<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Ma fiche administrateur</title>

    <link rel="stylesheet" th:href="@{/css/pages/profile.css}"/>

    <link rel="stylesheet"
          href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css"/>
</head>

<body>

<input id="toggle-sidebar" type="checkbox"/>

<header>
    <div class="head-box">

        <label for="toggle-sidebar">
            <div id="menu">
                <img th:src="@{/images/menu-burger.png}" alt="Menu"/>
            </div>
        </label>

        <h2 class="text-title">Ma fiche Admin</h2>

    </div>
</header>

<section th:replace="admin/admin-dashboard :: sidebar"></section>

<main class="center-wrapper">

    <section class="all-info">

        <!-- =========================
             PROFIL / RÉSUMÉ
        ========================== -->

        <aside class="summary">

            <div class="photo">
                <img th:src="@{/images/self.jpg}" alt="Photo de profil"/>
            </div>

            <span class="name"
                  th:text="${admin.prenom+' '+admin.nom}">
            </span>

            <div class="summary-container">
                <img th:src="@{/images/power.png}" alt=""/>
                <span class="activity">Administrateur actif</span>
            </div>

            <div class="others">

                <div class="other">
                    <img th:src="@{/images/department.png}" alt=""/>
                    <div class="summary-infos">
                        <span class="summary-info">Département :</span>
                        <span class="value">Informatique</span>
                    </div>
                </div>

            </div>

            <div class="account-settings">
                <a th:href="@{/admin/edit-my-profile}">
                    <img th:src="@{/images/preferences.png}" alt=""/>
                    <span>Paramètres du compte</span>
                </a>
            </div>

        </aside>


        <!-- =========================
             INFORMATIONS DÉTAILLÉES
        ========================== -->

        <div class="generals">

            <!-- Informations générales -->

            <section class="information-section">

                <h3 class="title-container">Informations générales</h3>

                <div class="container">

                    <div class="info">
                        <img th:src="@{/images/id-card.png}" alt=""/>
                        <div class="content">
                            <span class="label">Nom et prénom :</span>
                            <span class="value"
                                  th:text="${admin.prenom+' '+admin.nom}">
                            </span>
                        </div>
                    </div>

                    <div class="info">
                        <img th:src="@{/images/gender.png}" alt=""/>
                        <div class="content">
                            <span class="label">Sexe :</span>
                            <span class="value" th:text="${admin.sexe}"></span>
                        </div>
                    </div>

                    <div class="info">
                        <img th:src="@{/images/building.png}" alt=""/>
                        <div class="content">
                            <span class="label">CIN / Passeport :</span>
                            <span class="value" th:text="${admin.userId}"></span>
                        </div>
                    </div>

                    <div class="info">
                        <img th:src="@{/images/united-nations.png}" alt=""/>
                        <div class="content">
                            <span class="label">Nationalité :</span>
                            <span class="value" th:text="${admin.nationalite}"></span>
                        </div>
                    </div>

                </div>

            </section>


            <!-- Informations de localisation -->

            <section class="information-section">

                <h3 class="title-container">Informations de localisation</h3>

                <div class="container">

                </div>

            </section>


            <!-- Informations de contact -->

            <section class="information-section">

                <h3 class="title-container">Informations de contact</h3>

                <div class="container">

                    <div class="info">
                        <img th:src="@{/images/mail.png}" alt=""/>
                        <div class="content">
                            <span class="label">Email :</span>
                            <span class="value" th:text="${admin.email}"></span>
                        </div>
                    </div>

                    <div class="info">
                        <img th:src="@{/images/smartphone-call.png}" alt=""/>
                        <div class="content">
                            <span class="label">Téléphone :</span>
                            <span class="value" th:text="${admin.telephone}"></span>
                        </div>
                    </div>

                </div>

            </section>

        </div>

    </section>

</main>

</body>
</html>
