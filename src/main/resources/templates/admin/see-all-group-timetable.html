<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Timetable </title>
    <link rel="stylesheet" th:href="@{/css/style-admin/style-admin-dashboard.css}">

    <link rel="stylesheet" th:href="@{/css/style-admin/style-see-all-professor-timetable.css}">
</head>
<body>
<input type="checkbox" id="toggle-sidebar" />
<header>
    <div class="head-box">
        <!-- Checkbox caché -->

        <label for="toggle-sidebar">
            <div  id="menu">

                <img th:src="@{/images/menu-burger.png}">


            </div>
        </label>
        <h2 class="text-title">Emploi Du Temps Des Etudiants  </h2>
    </div>
</header>
<main class="center-container">
    <section class="list-department">
        <div class="departement-title">
            <h3>DEPARTEMENTS</h3>
        </div>
        <div class="departments">
            <div class="departement">
                <a th:href="@{/timetables/group/timetable/MAT}">
                <div class="dep-header">
                    <img th:src="@{/images/inline-right-svgrepo-com.svg}">
                    <h3>Mathématiques</h3>
                </div>
                </a>

            </div>
            <div class="departement">
                <a th:href="@{/timetables/group/timetable/INF}">
                <div class="dep-header">
                    <img th:src="@{/images/inline-right-svgrepo-com.svg}">
                    <h3>Informatique</h3>
                </div>
                </a>
            </div>
            <div class="departement">
                <a th:href="@{/timetables/group/timetable/SV}">
                <div class="dep-header">
                    <img th:src="@{/images/inline-right-svgrepo-com.svg}">
                    <h3>Sciences de la vie</h3>
                </div>
                </a>
            </div>
            <div class="departement">
                <a th:href="@{/timetables/group/timetable/CHI}">
                <div class="dep-header">
                    <img th:src="@{/images/inline-right-svgrepo-com.svg}">
                    <h3>Chimie</h3>
                </div>
                </a>
            </div>
            <div class="departement">
                <a th:href="@{/timetables/group/timetable/PHY}">
                <div class="dep-header">
                    <img th:src="@{/images/inline-right-svgrepo-com.svg}">
                    <h3>Physique</h3>
                </div>
                </a>
            </div>
            <div class="departement">
                <a th:href="@{/timetables/group/timetable/ST}">
                <div class="dep-header">
                    <img th:src="@{/images/inline-right-svgrepo-com.svg}">
                    <h3>Sciences de la terre</h3>
                </div>
                </a>
            </div>
        </div>
    </section>
    <div class="table-content">
        <!-- Message si aucun professeur -->
        <div class="empty-message"
             th:if="${GroupTimetableList== null or GroupTimetableList.content.isEmpty()}">
            Veuillez sélectionner un département
        </div>
        <!-- Tableau -->
        <table th:if="${GroupTimetableList != null and !GroupTimetableList.content.isEmpty()}"
               bgcolor="lightgray"
               border="1"
               rules="all" class="styled-table">
            <thead>
            <tr>
                <th>Departement</th>
                <th>Groupe</th>
                <th>Niveau</th>
                <th>Filière</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="grouptimetable : ${GroupTimetableList.content}">
                <td th:text="${grouptimetable.department}" class="clickable-row"
                    th:data-image="@{/timetables/preview/{id}(id=${grouptimetable.id})}" onclick="event.stopPropagation()">
                </td>
                <td th:text="${grouptimetable.field}" ></td>
                <td th:text="${grouptimetable.year}"></td>
                <td>
                    <a th:href="@{/students/{group}/{year}/{field}/details(
        field=${grouptimetable.field},
        year=${grouptimetable.year},
        group=${grouptimetable.group})}"
                       th:text="${grouptimetable.group}" class="no-style-link">
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
        <div style="margin-top:20px" th:if="${GroupTimetableList != null}">
            <a th:if="${GroupTimetableList.hasPrevious()}"
               th:href="@{/timetables/group/timetable/{departement}(
        departement=${selectedDepartment},
        page=${GroupTimetableList.number - 1},
        size=${GroupTimetableList.size})}">
                ⬅ Précédent
            </a>

            <span th:if="${GroupTimetableList.totalPages > 0}">
        Page
        <span th:text="${GroupTimetableList.number + 1}"></span>
        /
        <span th:text="${GroupTimetableList.totalPages}"></span>
    </span>

            <a th:if="${GroupTimetableList.hasNext()}"
               th:href="@{/timetables/group/timetable/{departement}(
        departement=${selectedDepartment},
        page=${GroupTimetableList.number + 1},
        size=${GroupTimetableList.size})}">
                Suivant ➡
            </a>

        </div>
    </div>
</main>
<section th:replace="admin/admin-dashboard :: sidebar">

</section>
<div id="timetableModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.7); justify-content:center; align-items:center;">
    <span id="closeModal" style="position:absolute; top:20px; right:30px; color:white; cursor:pointer; font-size:30px;">&times;</span>
    <img id="modalImage" src="" style="max-width:80%; max-height:80%; border:2px solid white;">
</div>
<div id="studentModal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
">

    <div style="background:white;width:900px;height:600px;padding:10px">

        <span onclick="closeModal()" style="cursor:pointer;font-size:25px">✖</span>

        <iframe id="studentFrame"
                width="100%"
                height="90%"
                style="border:none">
        </iframe>

    </div>
</div>
<script>
    document.querySelectorAll('.clickable-row').forEach(row => {
        row.addEventListener('click', () => {
            const imageUrl = row.dataset.image; // ex: /preview/123
            const modal = document.getElementById('timetableModal');
            const modalImg = document.getElementById('modalImage');

            modalImg.src = imageUrl; // Spring renverra le byte[] comme image
            modal.style.display = 'flex';
        });
    });

    // Fermer le modal
    document.getElementById('closeModal').addEventListener('click', () => {
        document.getElementById('timetableModal').style.display = 'none';
    });

    // Fermer en cliquant en dehors de l'image
    document.getElementById('timetableModal').addEventListener('click', (e) => {
        if (e.target.id === 'timetableModal') {
            document.getElementById('timetableModal').style.display = 'none';
        }
    });
</script>
<style>
    .no-style-link {
    text-decoration: none; /* enlève le soulignement */
    color: inherit;         /* garde la couleur du texte du parent */
}

.no-style-link:hover {
    color: inherit;         /* évite la couleur différente au survol */
    text-decoration: none;  /* pas de soulignement au hover */
}
    @media (max-width: 768px) {
    .head-box {
        gap: 10px;
        padding: 10px;
    }

    .text-title {
        font-size: 20px;
    }

    .center-container {
        margin: 80px 10px 20px 10px;
        padding: 15px;
    }

    .icons {
        width: 220px;
    }

    .center-container
    {
        display: flex;
        flex-direction: column-reverse;
        width: fit-content;
    }
}
</style>
</body>
</html>
