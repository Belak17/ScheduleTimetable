<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Group Timetable </title>
    <link rel="stylesheet" th:href="@{/css/style-admin/style-see-all-professor-timetable.css}">
</head>
<body>
<input type="checkbox" id="toggle-sidebar" />
<header>
    <div class="head-box">
        <!-- Checkbox caché -->

        <label for="toggle-sidebar">
            <div  id="menu">

                <img th:src="@{/images/menu-burger.png}">


            </div>
        </label>
        <h2 class="text-title">Emploi Du Temps Des Etudiants  </h2>
    </div>
</header>
<main class="center-wrapper">

    <table Bgcolor="lightgray" Border="1" rules="all">
        <thead>
        <tr>
            <th>Identifiant</th>
            <th>Departement</th>
            <th>Filiere</th>
            <th>Groupe</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="grouptimetable : ${GroupTimetableList.content}">
            <td th:text="${grouptimetable.id}" class="clickable-row"
                th:data-image="@{/timetables/preview/{id}(id=${grouptimetable.id})}"></td>
            <td th:text="${grouptimetable.department}"></td>
            <td th:text="${grouptimetable.field + grouptimetable.year}"></td>
            <td>
                <a th:href="@{/students/student/{field}/{year}/{group}/details(
        field=${grouptimetable.field},
        year=${grouptimetable.year},
        group=${grouptimetable.group})}"
                   th:text="${grouptimetable.group}" class="no-style-link">
                </a>
            </td>
        </tr>
        </tbody>
    </table>
    <div style="margin-top:20px">

        <!-- Previous -->
        <a th:if="${GroupTimetableList.hasPrevious()}"
           th:href="@{/timetables/group/timetable(page=${GroupTimetableList.number - 1}, size=${GroupTimetableList.size})}">
            ⬅ Previous
        </a>

        <!-- Page -->
        <span th:if="${GroupTimetableList.totalPages > 0}">
        Page
        <span th:text="${GroupTimetableList.number + 1}"></span>
        /
        <span th:text="${GroupTimetableList.totalPages}"></span>
    </span>

        <!-- Next -->
        <a th:if="${GroupTimetableList.hasNext()}"
           th:href="@{/timetables/group/timetable(page=${GroupTimetableList.number + 1}, size=${GroupTimetableList.size})}">
            Next ➡
        </a>

    </div>
</main>
<section th:replace="admin/admin-dashboard :: sidebar">

</section>
<div id="timetableModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.7); justify-content:center; align-items:center;">
    <span id="closeModal" style="position:absolute; top:20px; right:30px; color:white; cursor:pointer; font-size:30px;">&times;</span>
    <img id="modalImage" src="" style="max-width:80%; max-height:80%; border:2px solid white;">
</div>
<div id="studentModal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
">

    <div style="background:white;width:900px;height:600px;padding:10px">

        <span onclick="closeModal()" style="cursor:pointer;font-size:25px">✖</span>

        <iframe id="studentFrame"
                width="100%"
                height="90%"
                style="border:none">
        </iframe>

    </div>
</div>
<script>
    document.querySelectorAll('.clickable-row').forEach(row => {
        row.addEventListener('click', () => {
            const imageUrl = row.dataset.image; // ex: /preview/123
            const modal = document.getElementById('timetableModal');
            const modalImg = document.getElementById('modalImage');

            modalImg.src = imageUrl; // Spring renverra le byte[] comme image
            modal.style.display = 'flex';
        });
    });

    // Fermer le modal
    document.getElementById('closeModal').addEventListener('click', () => {
        document.getElementById('timetableModal').style.display = 'none';
    });

    // Fermer en cliquant en dehors de l'image
    document.getElementById('timetableModal').addEventListener('click', (e) => {
        if (e.target.id === 'timetableModal') {
            document.getElementById('timetableModal').style.display = 'none';
        }
    });
</script>
<style>
    .no-style-link {
    text-decoration: none; /* enlève le soulignement */
    color: inherit;         /* garde la couleur du texte du parent */
}

.no-style-link:hover {
    color: inherit;         /* évite la couleur différente au survol */
    text-decoration: none;  /* pas de soulignement au hover */
}
</style>
</body>
</html>
