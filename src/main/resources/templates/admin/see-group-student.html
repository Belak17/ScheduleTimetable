<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Timetable </title>
    <link rel="stylesheet" th:href="@{/css/style-admin/style-admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/style-admin/style-see-all-professor-timetable.css}">
</head>
<body>
<input type="checkbox" id="toggle-sidebar" />
<header>
    <div class="head-box">
        <!-- Checkbox caché -->

        <label for="toggle-sidebar">
            <div  id="menu">

                <img th:src="@{/images/menu-burger.png}">


            </div>
        </label>
        <h2 class="text-title">Details Etudiants  </h2>
    </div>
</header>
<main class="center-wrapper">
    <table bgcolor="lightgray" border="1" rules="all" class="styled-table">
        <thead>
        <tr>
            <th>Filiere</th>
            <th>Groupe</th>
            <th>Annee</th>
            <th>Nom</th>
            <th>Prenom</th>
            <th>Email</th>
            <th>Identfiant</th>
        </tr>
        </thead>
        <tr th:each="student : ${students.content}">
            <td th:text="${student.field}"></td>
            <td th:text="${student.group}"></td>
            <td th:text="${student.year}"></td>
            <td th:text="${student.nom}"></td>
            <td th:text="${student.prenom}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.userId}"></td>
        </tr>

    </table>
    <div class="pagination" style="margin-top: 20px;">

        <!-- Bouton Précédent -->
        <a th:if="${students.hasPrevious()}"
           th:href="${group != null}
           ? @{/students/{field}/{year}/{group}/details(
                field=${field},
                year=${year},
                group=${group},
                page=${students.number - 1},
                size=${students.size})}
           : @{/students/{field}/{year}/details(
                field=${field},
                year=${year},
                page=${students.number - 1},
                size=${students.size})}"
           class="button">
            ← Précédent
        </a>

        <!-- Numéro de page -->
        <span th:if="${students.totalPages > 0}">
        Page
        <span th:text="${students.number + 1}"></span>
        sur
        <span th:text="${students.totalPages}"></span>
    </span>

        <!-- Bouton Suivant -->
        <a th:if="${students.hasNext()}"
           th:href="${group != null}
           ? @{/students/{field}/{year}/{group}/details(
                field=${field},
                year=${year},
                group=${group},
                page=${students.number + 1},
                size=${students.size})}
           : @{/students/{field}/{year}/details(
                field=${field},
                year=${year},
                page=${students.number + 1},
                size=${students.size})}"
           class="button">
            Suivant →
        </a>

    </div>
</main>
<section th:replace="admin/admin-dashboard :: sidebar">

</section>
<style>
</style>
</body>
</html>
