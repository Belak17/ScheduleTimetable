<!DOCTYPE html>

<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Upload Timetable</title>
<link rel="stylesheet" th:href="@{/css/admin/upload-users.css}"/>
<link href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css" rel="stylesheet"/>
</head>
<body>
<input id="toggle-sidebar" type="checkbox"/>
<header>
<div class="head-box">
<!-- Checkbox caché -->
<label for="toggle-sidebar">
<div id="menu">
<img th:src="@{/images/menu-burger.png}"/>
</div>
</label>
<h2>Envoi des emploi du temps </h2>
</div>
</header>
<section th:replace="admin/admin-dashboard :: sidebar">
</section>
<main class="center-wrapper">
<div class="upload">
<form class="form-upload" enctype="multipart/form-data" method="post" th:action="@{/professors/import}">
<h3>Informations des Professeurs</h3>
<label class="custom-file">
<input accept=".xls,.xlsx" class="excelFileInput" name="excelFile" type="file"/>
<span class="file-btn">Choisir un fichier</span>
<span class="file-name">Aucun fichier</span>
<button class="clearFileBtn" style="margin-left: 10px;" type="button">Supprimer</button>
<input name="id" th:value="${id}" type="hidden">
</input></label>
<button class="button-upload" type="submit">Uploader</button>
<span class="upload-message">Fichier chargé avec succès !</span>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
</form>
<form class="form-upload" enctype="multipart/form-data" id="group-upload" method="post" th:action="@{/students/import}">
<h3>Informations des Etudiants</h3>
<label class="custom-file">
<input accept=".xls,.xlsx" class="excelFileInput" name="excelFile" type="file"/>
<span class="file-btn">Choisir un fichier</span>
<span class="file-name">Aucun fichier</span>
<button class="clearFileBtn" style="margin-left: 10px;" type="button">Supprimer</button>
<input name="id" th:value="${id}" type="hidden">
</input></label>
<button class="button-upload" type="submit">Uploader</button>
<span class="upload-message">Fichier chargé avec succès !</span>
</form>
</div>
</main>
<style>
    .upload-message {
        display: none; /* caché par défaut */
        position: absolute;
        left: 60%;  /* à côté du formulaire */
        top: 60%;
        transform: translateY(-50%);
        background-color: #4CAF50;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 0.9rem;
        box-shadow: 0 0 5px #0003;
    }
</style>
<script>
    document.querySelectorAll('.form-upload').forEach(form => {

        const input = form.querySelector('.excelFileInput');
        const display = form.querySelector('.file-name');
        const clearBtn = form.querySelector('.clearFileBtn');
        const message = form.querySelector('.upload-message');

        input.addEventListener('change', function() {
            if(this.files.length > 0){
                display.textContent = this.files[0].name;

                message.style.display = 'inline';
                setTimeout(() => {
                    message.style.display = 'none';
                }, 3000);
            } else {
                display.textContent = "Aucun fichier";
            }
        });

        clearBtn.addEventListener('click', function() {
            input.value = "";
            display.textContent = "Aucun fichier";
            message.style.display = 'none';
        });

    });
</script>
</body>
</html>
