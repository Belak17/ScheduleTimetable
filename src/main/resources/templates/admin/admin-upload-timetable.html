<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Admin Upload Timetable</title>

    <link rel="stylesheet" th:href="@{/css/admin/upload-timetable.css}"/>
    <link href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css"
          rel="stylesheet"/>
</head>

<body>

<input id="toggle-sidebar" type="checkbox"/>

<header>
    <div class="head-box">

        <label for="toggle-sidebar">
            <div id="menu">
                <img th:src="@{/images/menu-burger.png}" alt="Menu"/>
            </div>
        </label>

        <h2>Envoi des emplois du temps</h2>

    </div>
</header>

<section th:replace="admin/admin-dashboard :: sidebar"></section>

<main class="center-wrappers">

    <!-- IMPORT PROFESSEURS -->
    <fieldset class="import-box">

        <legend>Importation en masse (XLSX) Professeurs</legend>

        <form class="form-upload"
              enctype="multipart/form-data"
              method="post"
              th:action="@{/timetables/upload/professortimetable}">

            <div class="info-input full">

                <label>Fichier Excel (.xlsx)</label>

                <input accept=".xls,.xlsx"
                       class="excelFileInput"
                       name="excelFile"
                       required
                       type="file"/>

                <div class="file-name" style="display: none;">
                    Aucun fichier sélectionné
                </div>

            </div>

            <div class="buttons">

                <button class="clearFileBtn" type="button">
                    Supprimer
                </button>

                <button class="submit button-upload" type="submit">
                    Importer
                </button>

                <input name="id" th:value="${id}" type="hidden"/>

            </div>

            <span class="upload-message alert alert-success" style="display:none;">
                Fichier chargé avec succès !
            </span>

            <div class="alert alert-danger"
                 th:if="${error}"
                 th:text="${error}">
            </div>

            <div class="alert alert-success"
                 th:if="${success}"
                 th:text="${success}">
            </div>

        </form>

    </fieldset>


    <!-- IMPORT ÉTUDIANTS -->
    <fieldset class="import-box">

        <legend>Importation en masse (XLSX) Étudiants</legend>

        <form class="form-upload"
              enctype="multipart/form-data"
              method="post"
              th:action="@{/timetables/upload/grouptimetable}">

            <div class="info-input full">

                <label>Fichier Excel (.xlsx)</label>

                <input accept=".xls,.xlsx"
                       class="excelFileInput"
                       name="excelFile"
                       required
                       type="file"/>

                <div class="file-name" style="display: none;">
                    Aucun fichier sélectionné
                </div>

            </div>

            <div class="buttons">

                <button class="clearFileBtn" type="button">
                    Supprimer
                </button>

                <button class="submit button-upload" type="submit">
                    Importer
                </button>

                <input name="id" th:value="${id}" type="hidden"/>

            </div>

            <span class="upload-message alert alert-success" style="display:none;">
                Fichier chargé avec succès !
            </span>

            <div class="alert alert-danger"
                 th:if="${error}"
                 th:text="${error}">
            </div>

            <div class="alert alert-success"
                 th:if="${success}"
                 th:text="${success}">
            </div>

        </form>

    </fieldset>

</main>


<script>

    document.querySelectorAll('.form-upload').forEach(form => {

        const input = form.querySelector('.excelFileInput');
        const display = form.querySelector('.file-name');
        const clearBtn = form.querySelector('.clearFileBtn');
        const message = form.querySelector('.upload-message');

        input.addEventListener('change', function() {

            if (this.files.length > 0) {

                display.textContent = this.files[0].name;
                display.style.display = 'block';

                message.style.display = 'inline-flex';

                setTimeout(() => {
                    message.style.display = 'none';
                }, 3000);

            } else {

                display.textContent = "Aucun fichier";
                display.style.display = 'none';

            }

        });

        clearBtn.addEventListener('click', function() {

            input.value = "";

            display.textContent = "Aucun fichier";
            display.style.display = 'none';

            message.style.display = 'none';

        });

    });

</script>

</body>
</html>
