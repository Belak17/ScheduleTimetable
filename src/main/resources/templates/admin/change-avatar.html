<section class="option-clicked" th:fragment="option-clicked">
    <div class="title-bloc">
        <img th:src="@{/images/profile-picture.png}">
        <span>Changer la photo de profil</span>
    </div>
    <form th:action="@{/admin/profile/update}" method="post" enctype="multipart/form-data">
        <span class="title-container">Information Avatar</span>

        <div class="generals-info inputs-photo">

            <div class="info-input">
                <input id="profileImage" type="file" name="image" accept="image/*">
            </div>

            <div class="info-input">

            <img th:src="@{/images/self.jpg}" id="img-user">
            </div>
        </div>
    </form>
</section>
