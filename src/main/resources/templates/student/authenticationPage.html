<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Identification étudiant</title>

    <link rel="stylesheet"
          th:href="@{/css/pages/authenticationpage.css}"/>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>

<body>

<main class="container">

    <section class="form-card">

        <!-- EN-TÊTE -->
        <header class="form-header">

            <div class="icon-container">
                <i class="fas fa-user-graduate"></i>
            </div>

            <span class="eyebrow">VALIDATION DE PRÉSENCE</span>

            <h1>Identification</h1>

            <p>
                Veuillez saisir votre identifiant étudiant
                pour valider votre présence.
            </p>

        </header>


        <!-- FORMULAIRE -->
        <form class="student-form"
              id="studentForm"
              method="post"
              th:action="@{/api/qr/scan/authenticated}">

            <!-- Code du QR -->
            <input name="code"
                   th:value="${code}"
                   type="hidden"/>

            <!-- UUID de l'appareil / navigateur -->
            <input id="deviceUUID"
                   name="deviceUUID"
                   th:value="${deviceUUID}"
                   type="hidden"/>


            <!-- IDENTIFIANT ÉTUDIANT -->
            <div class="form-group">

                <label for="studentId">
                    Identifiant étudiant
                </label>

                <div class="input-wrapper">

                    <i class="fas fa-id-card"></i>

                    <input autocomplete="off"
                           id="studentId"
                           name="userId"
                           placeholder="Exemple : 12345678"
                           required
                           type="text"/>

                </div>

                <span class="input-hint">
                    Saisissez votre identifiant universitaire.
                </span>

            </div>


            <!-- BOUTON DE VALIDATION -->
            <button id="submitButton" type="submit">

                <i class="fas fa-check-circle"></i>

                <span>Valider ma présence</span>

            </button>

        </form>


        <!-- INFORMATIONS DE SÉCURITÉ -->
        <footer class="form-footer">

            <div class="security-icon">
                <i class="fas fa-shield-alt"></i>
            </div>

            <p>
                Vos informations sont utilisées uniquement
                pour la validation de votre présence.
            </p>

        </footer>

    </section>

</main>


<!-- GESTION DE L'IDENTIFIANT DE L'APPAREIL -->
<script>

    document.addEventListener("DOMContentLoaded", function () {

        const deviceUUIDInput = document.getElementById("deviceUUID");
        const studentForm = document.getElementById("studentForm");
        const submitButton = document.getElementById("submitButton");

        try {

            // On récupère prioritairement l'UUID transmis par Spring
            let deviceUUID = deviceUUIDInput.value;

            // Si absent, on consulte le localStorage
            if (!deviceUUID) {

                deviceUUID = localStorage.getItem("device_uuid");
            }

            // Si toujours absent, on génère un nouvel UUID
            if (!deviceUUID) {

                deviceUUID = crypto.randomUUID();
            }

            // Conservation de l'UUID
            localStorage.setItem("device_uuid", deviceUUID);

            // Injection dans le formulaire
            deviceUUIDInput.value = deviceUUID;

            console.log("Device UUID utilisé :", deviceUUID);

        } catch (error) {

            console.error("Erreur UUID :", error);

            submitButton.disabled = true;

            alert("Impossible d'identifier votre navigateur.");

        }

        studentForm.addEventListener("submit", function (event) {

            if (!deviceUUIDInput.value) {

                event.preventDefault();

                alert("Identifiant de l'appareil introuvable.");

                return;
            }

            console.log("UUID transmis :", deviceUUIDInput.value);

            submitButton.disabled = true;

            submitButton.innerHTML =
                '<i class="fas fa-spinner fa-spin"></i><span>Validation en cours...</span>';

        });

    });

</script>

</body>
</html>
