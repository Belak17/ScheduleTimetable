<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Identification Étudiant</title>

  <link rel="stylesheet"
        th:href="@{/css/style-student/style-room-scan.css}">

  <link rel="stylesheet"
        href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css">
</head>

<body>


<main class="center-wrapper">

  <h2 class="separator">Validation de présence</h2>

  <section class="result-scanner">

    <!-- Icône -->
    <div class="check-circle">
      <i class="fi fi-ss-building"></i>
    </div>

    <!-- Message -->
    <h3 class="success-title">
      QR Code de la salle scanné
    </h3>

    <p class="scan-message">
      Vous avez scanné le code QR de cette salle.
    </p>

    <!-- Informations de la salle -->
    <div class="validation-details">

      <p>
        <strong>Salle :</strong>
        <span th:text="${code}"></span>
      </p>


    </div>

    <!-- Identification étudiant -->
    <form th:action="@{/api/qr/scan/authenticated}"
          method="post"
          class="student-form">

      <input type="hidden"
             name="code"
             th:value="${code}">

      <!-- Identifiant unique de l'appareil -->
      <input type="hidden"
             id="deviceUuid"
             name="deviceUuid">

      <label for="studentId">
        Identifiant étudiant
      </label>

      <input
              type="text"
              id="studentId"
              name="userId"
              placeholder="Entrez votre identifiant"
              required
              minlength="8"
              maxlength="8"
              autocomplete="off"
      >

      <button type="submit">
        <i class="fi fi-ss-check"></i>
        Valider ma présence
      </button>

    </form>
  </section>

</main>
<script>
  document.addEventListener("DOMContentLoaded", function () {

      function getDeviceUUID() {

          let deviceUUID = localStorage.getItem("device_uuid");

          if (!deviceUUID) {

              deviceUUID = crypto.randomUUID();

              localStorage.setItem("device_uuid", deviceUUID);
          }

          return deviceUUID;
      }

      // Récupération de l'identifiant persistant
      const deviceUUID = getDeviceUUID();

      // Transmission au formulaire
      document.getElementById("deviceUuid").value = deviceUUID;

  });
</script>
</body>
</html>
