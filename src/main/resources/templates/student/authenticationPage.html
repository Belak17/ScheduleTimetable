<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Identification étudiant</title>

  <link rel="stylesheet"
        th:href="@{/css/style-student/style-validation.css}">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="container">

  <div class="form-card">

    <div class="form-header">
      <div class="icon-container">
        <i class="fas fa-user-graduate"></i>
      </div>

      <h1>Identification</h1>

      <p>
        Veuillez saisir votre identifiant étudiant
        pour valider votre présence.
      </p>
    </div>

    <form th:action="@{/api/qr/scan/authenticated}"
          method="post"
          class="student-form"
          id="studentForm">

      <!-- Code du QR -->
      <input type="hidden"
             name="code"
             th:value="${code}">

      <!-- UUID de l'appareil / navigateur -->
      <input type="hidden"
             id="deviceUUID"
             name="deviceUUID"
             th:value="${deviceUUID}">

      <div class="form-group">

        <label for="studentId">
          Identifiant étudiant
        </label>

        <div class="input-wrapper">
          <i class="fas fa-id-card"></i>

          <input type="text"
                 id="studentId"
                 name="userId"
                 placeholder="Exemple : 12345678"
                 autocomplete="off"
                 required>
        </div>

      </div>

      <button type="submit" id="submitButton">

        <i class="fas fa-check-circle"></i>

        Valider ma présence

      </button>

    </form>

    <div class="form-footer">
      <p>
        <i class="fas fa-shield-alt"></i>
        Vos informations sont utilisées uniquement
        pour la validation de votre présence.
      </p>
    </div>

  </div>

</div>

<script>

  document.addEventListener("DOMContentLoaded", function () {

      const deviceUUIDInput = document.getElementById("deviceUUID");
      const studentForm = document.getElementById("studentForm");
      const submitButton = document.getElementById("submitButton");

      try {

          // On récupère prioritairement l'UUID transmis par Spring
          let deviceUUID = deviceUUIDInput.value;

          // Si absent, on consulte le localStorage
          if (!deviceUUID) {

              deviceUUID = localStorage.getItem("device_uuid");
          }

          // Si toujours absent, on génère un nouvel UUID
          if (!deviceUUID) {

              deviceUUID = crypto.randomUUID();
          }

          // Conservation de l'UUID
          localStorage.setItem("device_uuid", deviceUUID);

          // Injection dans le formulaire
          deviceUUIDInput.value = deviceUUID;

          console.log("Device UUID utilisé :", deviceUUID);

      } catch (error) {

          console.error("Erreur UUID :", error);

          submitButton.disabled = true;

          alert("Impossible d'identifier votre navigateur.");

      }

      studentForm.addEventListener("submit", function (event) {

          if (!deviceUUIDInput.value) {

              event.preventDefault();

              alert("Identifiant de l'appareil introuvable.");

              return;
          }

          console.log("UUID transmis :", deviceUUIDInput.value);

          submitButton.disabled = true;

          submitButton.innerHTML =
              '<i class="fas fa-spinner fa-spin"></i> Validation en cours...';

      });

  });

</script>

</body>
</html>
