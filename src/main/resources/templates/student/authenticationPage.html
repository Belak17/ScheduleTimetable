<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Identification étudiant</title>

  <link rel="stylesheet"
        th:href="@{/css/style-student/style-validation.css}">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="container">

  <div class="form-card">

    <div class="form-header">
      <div class="icon-container">
        <i class="fas fa-user-graduate"></i>
      </div>

      <h1>Identification</h1>

      <p>
        Veuillez saisir votre identifiant étudiant
        pour valider votre présence.
      </p>
    </div>

    <form th:action="@{/api/qr/scan/authenticated}"
          method="post"
          class="student-form"
          id="studentForm">

      <!-- Code du QR -->
      <input type="hidden"
             name="code"
             th:value="${code}">

      <!-- UUID de l'appareil / navigateur -->
      <input type="hidden"
             id="deviceUUID"
             name="deviceUUID">

      <div class="form-group">

        <label for="studentId">
          Identifiant étudiant
        </label>

        <div class="input-wrapper">
          <i class="fas fa-id-card"></i>

          <input type="text"
                 id="studentId"
                 name="userId"
                 placeholder="Exemple : 12345678"
                 autocomplete="off"
                 required>
        </div>

      </div>

      <button type="submit" id="submitButton">

        <i class="fas fa-check-circle"></i>

        Valider ma présence

      </button>

    </form>

    <div class="form-footer">
      <p>
        <i class="fas fa-shield-alt"></i>
        Vos informations sont utilisées uniquement
        pour la validation de votre présence.
      </p>
    </div>

  </div>

</div>

<script>

  document.addEventListener("DOMContentLoaded", function () {

      const deviceUUIDInput = document.getElementById("deviceUUID");
      const studentForm = document.getElementById("studentForm");
      const submitButton = document.getElementById("submitButton");

      /**
       * Génère un UUID compatible avec les navigateurs modernes.
       */
      function generateUUID() {

          if (window.crypto && typeof window.crypto.randomUUID === "function") {
              return window.crypto.randomUUID();
          }

          if (window.crypto && typeof window.crypto.getRandomValues === "function") {

              const bytes = new Uint8Array(16);
              window.crypto.getRandomValues(bytes);

              bytes[6] = (bytes[6] & 0x0f) | 0x40;
              bytes[8] = (bytes[8] & 0x3f) | 0x80;

              const hex = Array.from(bytes, byte =>
                  byte.toString(16).padStart(2, "0")
              );

              return [
                  hex.slice(0, 4).join(""),
                  hex.slice(4, 6).join(""),
                  hex.slice(6, 8).join(""),
                  hex.slice(8, 10).join(""),
                  hex.slice(10, 16).join("")
              ].join("-");
          }

          throw new Error("Impossible de générer un identifiant pour cet appareil.");
      }

      /**
       * Récupère l'UUID existant ou en génère un nouveau.
       */
      function getDeviceUUID() {

          let deviceUUID = localStorage.getItem("device_uuid");

          if (!deviceUUID) {

              deviceUUID = generateUUID();

              localStorage.setItem("device_uuid", deviceUUID);
          }

          return deviceUUID;
      }

      try {

          const deviceUUID = getDeviceUUID();

          deviceUUIDInput.value = deviceUUID;

      } catch (error) {

          console.error("Erreur lors de la génération de l'UUID :", error);

          submitButton.disabled = true;

          alert("Impossible d'identifier votre navigateur. Veuillez vérifier votre connexion sécurisée et réessayer.");

      }

      /**
       * Vérifie que l'UUID est présent avant l'envoi.
       */
      studentForm.addEventListener("submit", function (event) {

          if (!deviceUUIDInput.value) {

              event.preventDefault();

              alert("L'identifiant de votre appareil n'a pas pu être récupéré. Veuillez actualiser la page.");

              return;
          }

          submitButton.disabled = true;
          submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Validation en cours...';

      });

  });

</script>

</body>
</html>
