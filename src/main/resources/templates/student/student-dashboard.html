<!DOCTYPE html>
<html lang="fr"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style-admin/style-admin-dashboard.css}">
    <link rel="stylesheet"
          href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
<input type="checkbox" id="toggle-sidebar" />
<header>
    <div class="head-box">
        <!-- Checkbox caché -->

        <label for="toggle-sidebar">
            <div  id="menu">
                <img th:src="@{/images/menu-burger.png}">
            </div>
        </label>
        <h2 th:text="'Bienvenue cher Etudiant ' + ${fullname}"></h2>
    </div>
</header>
<section class="icons" th:fragment="sidebar">
    <div>
        <h2>
            Menu
        </h2>
    </div>

    <div class="icons-option">
        <div class="icon-container">
            <a th:href="@{/student/dashboard}">
                <img th:src="@{/images/home.png}" width="20">

                <span class="tooltip">Dashboard</span>
            </a>
        </div>
        <div class="icon-container">
            <a th:href="@{/student/profile}">
                <img th:src="@{/images/user (1).png}" width="20">

                <span class="tooltip">Profil</span>
            </a>
        </div>
        <div class="icon-container">
            <a th:href="@{/student/timetable}">
                <img th:src="@{/images/calendar-clock (1).png}" width="20">


                <span class="tooltip">Emploi du temps </span>
            </a>
        </div>
        <div class="icon-container">

            <label for="toggle-sidebar" class="close-btn">
                <img th:src="@{/images/grid.png}" width="20">

                <span class="tooltip">Espace </span>
            </label>
        </div>
        <div class="icon-container">

            <label for="toggle-sidebar" class="close-btn">
                <img th:src="@{/images/cross-small.png}" width="20">

                <span class="tooltip">Fermer </span>
            </label>
        </div>
    </div>
</section>
<main class="center-wrapper">
    <h2 class="separator">Menu Etudiant</h2>
    <section class="grid">

        <div class="option" style="background-color: rgba(78, 37, 144, 0.534);">
            <a th:href="@{/student/timetable}">
                <p> Emploi du temps</p>
                <img th:src="@{/images/academic-years.png}">
            </a>
        </div>
        <div class="option" id="scan-button">

            <p>Scanner Code</p>
            <img th:src="@{/images/qr-code.png}" alt="QR CODE">

        </div>
        <div class="option" style="background-color: rgba(69, 96, 122, 0.53);">
            <a th:href="@{/student/absences}">
                <p>Vos absences</p>
                <img th:src="@{/images/absent.png}" alt="Absences">
            </a>
        </div>
        <div class="option" style="background-color: rgb(113, 113, 230);">
            <a th:href="@{/student/profile}">
                <p>Profil </p>
                <img th:src="@{/images/user-profile.png}" alt="Profil">
            </a>
        </div>
        <div class="option" style="background-color: rgba(22, 123, 205, 0.532);">
            <a th:href="@{/logout}">
                <p>Deconnexion </p>
                <img th:src="@{/images/power-off.png}" alt="Deconnexion">
            </a>
        </div>
    </section>
    <div id="scanner-container">

        <div id="reader"></div>

        <p id="result"></p>

    </div>

</main>
<script>

    const scanButton = document.getElementById("scan-button");
    const scannerContainer = document.getElementById("scanner-container");
    const result = document.getElementById("result");

    let html5QrCode;
    let started = false;

    scanButton.addEventListener("click", async () => {

        if (started) return;

        started = true;

        try {

            scannerContainer.style.display = "block";

            html5QrCode = new Html5Qrcode("reader");

            // récupérer les caméras disponibles
            const cameras = await Html5Qrcode.getCameras();

            if (!cameras || cameras.length === 0) {

                result.innerText =
                    "Aucune caméra détectée";

                started = false;

                return;
            }

            // choisir caméra arrière si possible
            const backCamera =
                cameras.find(camera =>
                    camera.label.toLowerCase().includes("back") ||
                    camera.label.toLowerCase().includes("rear")
                ) || cameras[0];

            // démarrer le scanner
            await html5QrCode.start(

                backCamera.id,

                {
                    fps: 10,

                    qrbox: {
                        width: 250,
                        height: 250
                    }
                },

                // succès scan
                async (decodedText) => {

                    result.innerText =
                        "QR détecté : " + decodedText;

                    // arrêter caméra
                    await html5QrCode.stop();

                    // envoyer au backend
                    await fetch("/api/qr/scan", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            code: decodedText
                        })
                    });

                    started = false;
                },

                // erreurs de lecture ignorées
                (errorMessage) => {

                }
            );

        } catch (err) {

            console.error(err);

            result.innerText =
                "Erreur caméra : " + err;

            started = false;
        }

    });
</script>
</body>


</html>
