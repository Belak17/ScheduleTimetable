<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner QR</title>
    <link rel="stylesheet" th:href="@{/css/style-admin/style-admin-dashboard.css}">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
<input type="checkbox" id="toggle-sidebar" />
<header>
    <div class="head-box">
        <!-- Checkbox caché -->
        <label for="toggle-sidebar">
            <div  id="menu">
                <img th:src="@{/images/menu-burger.png}">
            </div>
        </label>
        <h2>Scanner Code Qr</h2>
    </div>
</header>
<section th:replace="student/student-dashboard :: sidebar">
</section>
<main class="center-wrapper">
<div id="reader"></div>
<p id="result"></p>
</main>

<script>
    const html5QrCode = new Html5Qrcode("reader");

    let isScanning = true;

    // Génération ou récupération de l'identifiant de l'appareil
    function getDeviceUUID() {

        let deviceUUID = localStorage.getItem("device_uuid");

        if (!deviceUUID) {
            deviceUUID = crypto.randomUUID();

            localStorage.setItem("device_uuid", deviceUUID);
        }

        return deviceUUID;
    }

    function onScanSuccess(decodedText) {

        if (!isScanning) return;
        isScanning = false;

        html5QrCode.stop().then(() => {

            const deviceUUID = getDeviceUUID();

            const url = new URL("/api/qr/scan", window.location.origin);

            url.searchParams.set("code",
                decodedText.replace(
                    "https://172.20.96.216:8082/api/qr/scan?code=",
                    ""
                )
            );

            url.searchParams.set("deviceUuid", deviceUUID);

            window.location.href = url.toString();

        }).catch(error => {
            console.error("Erreur lors de l'arrêt du scanner :", error);
            isScanning = true;
        });
    }

    Html5Qrcode.getCameras().then(devices => {

        if (!devices || devices.length === 0) {
            console.error("Aucune caméra détectée");
            return;
        }

        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            onScanSuccess
        );

    }).catch(error => {
        console.error("Impossible d'accéder à la caméra :", error);
    });
</script>

</body>
</html>
