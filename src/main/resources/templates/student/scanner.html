<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scanner QR | ScheduleTimetable</title>

    <link rel="stylesheet" th:href="@{/css/pages/scanner.css}"/>

    <link rel="stylesheet"
          href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css">

    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

<input id="toggle-sidebar" type="checkbox"/>

<header>
    <div class="head-box">

        <label for="toggle-sidebar">
            <div id="menu">
                <img alt="Menu" th:src="@{/images/menu-burger.png}"/>
            </div>
        </label>

        <h1>Scanner QR</h1>

    </div>
</header>

<section th:replace="student/student-dashboard :: sidebar"></section>

<main class="page-content">

    <div class="page-heading">
        <h2>Scanner un code QR</h2>
        <p>Scannez le code QR de votre salle pour enregistrer votre présence.</p>
    </div>

    <section class="scanner-card">

        <div class="scanner-header">
            <div>
                <h3>Lecteur QR</h3>
                <p>Placez le code QR devant votre caméra.</p>
            </div>

            <span class="scanner-status">
                <span class="status-dot"></span>
                Scanner prêt
            </span>
        </div>

        <div class="scanner-content">

            <div class="scanner-frame">
                <div id="reader"></div>
            </div>

            <div class="scanner-instructions">
                <i class="fi fi-ss-info"></i>
                <p>
                    Assurez-vous que le code QR est entièrement visible
                    dans la zone de lecture et que votre caméra est autorisée.
                </p>
            </div>

            <p id="result" class="scanner-result" role="status" aria-live="polite"></p>

        </div>

    </section>

</main>

<script>
    const html5QrCode = new Html5Qrcode("reader");

    let isScanning = true;

    function getDeviceUUID() {

        let deviceUUID = localStorage.getItem("device_uuid");

        if (!deviceUUID) {

            if (window.crypto && typeof window.crypto.randomUUID === "function") {

                deviceUUID = window.crypto.randomUUID();

            } else {

                const bytes = new Uint8Array(16);
                window.crypto.getRandomValues(bytes);

                bytes[6] = (bytes[6] & 0x0f) | 0x40;
                bytes[8] = (bytes[8] & 0x3f) | 0x80;

                const hex = Array.from(bytes, byte =>
                    byte.toString(16).padStart(2, "0")
                );

                deviceUUID = [
                    hex.slice(0, 4).join(""),
                    hex.slice(4, 6).join(""),
                    hex.slice(6, 8).join(""),
                    hex.slice(8, 10).join(""),
                    hex.slice(10, 16).join("")
                ].join("-");
            }

            localStorage.setItem("device_uuid", deviceUUID);
        }

        return deviceUUID;
    }

    function showResult(message, type = "error") {

        const result = document.getElementById("result");

        result.textContent = message;
        result.className = `scanner-result ${type}`;

    }

    function onScanSuccess(decodedText) {

        if (!isScanning) {
            return;
        }

        isScanning = false;

        html5QrCode.stop().then(() => {

            try {

                let code;

                try {

                    const qrUrl = new URL(decodedText);
                    code = qrUrl.searchParams.get("code");

                } catch (error) {

                    code = decodedText;

                }

                if (!code) {
                    throw new Error("Code QR invalide ou manquant.");
                }

                const deviceUUID = getDeviceUUID();

                const url = new URL(
                    "/api/qr/scan",
                    window.location.origin
                );

                url.searchParams.set("code", code);
                url.searchParams.set("deviceUUID", deviceUUID);

                window.location.href = url.toString();

            } catch (error) {

                console.error("Erreur QR :", error);

                showResult(
                    "Impossible de traiter ce QR Code. Veuillez réessayer."
                );

                isScanning = true;

            }

        }).catch(error => {

            console.error("Erreur arrêt scanner :", error);

            showResult("Une erreur est survenue lors de l'arrêt du scanner.");

            isScanning = true;

        });

    }

    Html5Qrcode.getCameras().then(devices => {

        if (!devices || devices.length === 0) {

            showResult("Aucune caméra détectée sur cet appareil.");

            return;
        }

        html5QrCode.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: 250
            },
            onScanSuccess
        );

    }).catch(error => {

        console.error("Erreur caméra :", error);

        showResult(
            "Impossible d'accéder à la caméra. Vérifiez les autorisations."
        );

    });

</script>

</body>
</html>
