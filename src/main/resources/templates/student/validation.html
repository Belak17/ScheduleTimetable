<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Page</title>
    <link rel="stylesheet" th:href="@{/css/style-student/style-validation.css}">
    <link rel="stylesheet"
          href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css">
</head>
<body>
<!-- HEADER -->
<header class="validation-header">
    <img th:src="@{/images/logo_header-hb5kR36g.svg}"
         alt="Logo de la Faculté des Sciences de Gabès">

    <a class="register" th:href="@{/login}">
        Retour à la connexion
    </a>
</header>
<main class="center-wrapper">

    <h2 class="separator">Présence Enregistrée</h2>

    <section class="result-scanner">

        <div class="check-circle">✓</div>

        <h3 class="success-title">
            Présence validée avec succès
        </h3>

        <div class="validation-details">

            <p>
                <strong>Nom de l'Etudiant :</strong>
                <span th:text="${validation.nom}"></span>
            </p>

            <p>
                <strong>Prenom de l'Etudiant :</strong>
                <span th:text="${validation.prenom}"></span>
            </p>

            <p>
                <strong>Cours :</strong>
                <span th:text="${validation.intitule}"></span>
            </p>

            <p>
                <strong>Groupe :</strong>
                <span th:text="${validation.group}"></span>
            </p>

            <p>
                <strong>Code :</strong>
                <span th:text="${validation.code}"></span>
            </p>

            <p>
                <strong>Date :</strong>
                <span th:text="${validation.date}"></span>
            </p>

            <p>
                <strong>Heure :</strong>
                <span th:text="${validation.time}"></span>
            </p>

            <p>
                <strong>Jour :</strong>
                <span th:text="${validation.day}"></span>
            </p>

        </div>

    </section>
    <!-- Bouton de retour à la connexion -->
    <div class="login-button-container">
        <a th:href="@{/login}" class="login-btn">
            <i class="fi fi-ss-sign-in-alt"></i>
            Retour à la connexion
        </a>
    </div>
</main>
<footer class="validation-footer">

    <div>
        <img th:src="@{/images/flag-BfSDlfLV.png}"
             alt="Drapeau tunisien">

        <h3>République Tunisienne</h3>
    </div>

    <p>
        &copy; Faculté des Sciences de Gabès - Tous droits réservés
    </p>

    <a href="mailto:fsg.rnu.tn">fsg.rnu.tn</a>

</footer>
</body>
</html>
