<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Page</title>
    <link rel="stylesheet" th:href="@{/css/style-student/style-validation.css}">
    <link rel="stylesheet"
          href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css">
</head>

<body>

<!-- HEADER -->
<header class="validation-header">
    <img th:src="@{/images/logo_header-hb5kR36g.svg}"
         alt="Logo de la Faculté des Sciences de Gabès">

    <a class="register" th:href="@{/login}">
        Retour à la connexion
    </a>
</header>

<!-- CONTENU DE VALIDATION -->
<main class="center-wrapper">

    <h2 class="separator error">Présence Déjà Enregistrée</h2>

    <section class="result-scanner error">

        <div class="check-circle error">
            ✕
        </div>

        <div class="validation-details">

            <p>
                <strong>Cause :</strong>
                <span th:text="${errorMessage}"></span>
            </p>

            <p>
                <strong>Nom :</strong>
                <span th:text="${nom}"></span>
            </p>

            <p>
                <strong>Prénom :</strong>
                <span th:text="${prenom}"></span>
            </p>

            <p>
                <strong>Cours :</strong>
                <span th:text="${intitule}"></span>
            </p>

            <p>
                <strong>Salle :</strong>
                <span th:text="${salle}"></span>
            </p>

            <p>
                <strong>Date :</strong>
                <span th:text="${date}"></span>
            </p>

            <p>
                <strong>Jour :</strong>
                <span th:text="${dayOfWeek}"></span>
            </p>

            <p>
                <strong>Heure d'enregistrement :</strong>
                <span th:text="${registrationTime}"></span>
            </p>

        </div>

    </section>

</main>

<!-- FOOTER -->
<footer class="validation-footer">

    <div>
        <img th:src="@{/images/flag-BfSDlfLV.png}"
             alt="Drapeau tunisien">

        <h3>République Tunisienne</h3>
    </div>

    <p>
        &copy; Faculté des Sciences de Gabès - Tous droits réservés
    </p>

    <a href="mailto:fsg.rnu.tn">fsg.rnu.tn</a>

</footer>

</body>
</html>
