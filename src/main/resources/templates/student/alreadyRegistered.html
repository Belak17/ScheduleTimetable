<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Présence déjà enregistrée</title>

    <link rel="stylesheet"
          th:href="@{/css/pages/alreadyregistered.css}"/>

    <link rel="stylesheet"
          href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css"/>
</head>

<body>

<main class="center-wrapper">

    <!-- EN-TÊTE -->
    <section class="page-heading">

        <div class="status-icon error">
            ✕
        </div>

        <div class="page-heading__text">
            <span class="eyebrow">VALIDATION DE PRÉSENCE</span>

            <h1>Présence déjà enregistrée</h1>

            <p>
                Une présence a déjà été enregistrée pour cette séance.
                Retrouvez ci-dessous les informations correspondantes.
            </p>
        </div>

    </section>


    <!-- RÉSULTAT -->
    <section class="result-scanner error">

        <div class="result-heading">
            <h2>Informations de l'enregistrement</h2>

            <span class="status-badge error">
                <i class="fi fi-ss-exclamation"></i>
                Déjà enregistré
            </span>
        </div>


        <!-- DÉTAILS -->
        <div class="validation-details">

            <div class="detail-row">
                <span class="detail-label">Cause</span>
                <span class="detail-value"
                      th:text="${errorMessage}"></span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Nom</span>
                <span class="detail-value"
                      th:text="${nom}"></span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Prénom</span>
                <span class="detail-value"
                      th:text="${prenom}"></span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Cours</span>
                <span class="detail-value"
                      th:text="${intitule}"></span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Salle</span>
                <span class="detail-value"
                      th:text="${salle}"></span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Date</span>
                <span class="detail-value"
                      th:text="${date}"></span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Jour</span>
                <span class="detail-value"
                      th:text="${dayOfWeek}"></span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Heure d'enregistrement</span>
                <span class="detail-value"
                      th:text="${registrationTime}"></span>
            </div>

        </div>

    </section>


    <!-- ACTION -->
    <div class="login-button-container">

        <a class="login-btn" th:href="@{/login}">
            <i class="fi fi-ss-sign-in-alt"></i>
            <span>Retour à la connexion</span>
        </a>

    </div>

</main>

</body>
</html>
